apiVersion: v1
kind: Namespace
metadata:
  name: lab-sre
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-demo
  namespace: lab-sre
  labels:
    app: crash-demo
    env: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crash-demo
  template:
    metadata:
      labels:
        app: crash-demo
    spec:
      containers:
      - name: crash-demo
        image: busybox:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Iniciando pod $(hostname)..."
          sleep 5
          echo "OK: arranque completado, entrando en espera"
          sleep infinity
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
